trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  acrServiceConnection: sagamarketplaceacr
  acrLoginServer: sagamarketplaceacr.azurecr.io
  imageTag: $(Build.BuildId)

steps:
- task: UseDotNet@2
  displayName: Use .NET SDK
  inputs:
    packageType: sdk
    version: 9.x

- script: dotnet restore
  displayName: Restore

- script: dotnet build --configuration $(buildConfiguration) --no-restore
  displayName: Build

- script: dotnet test --configuration $(buildConfiguration) --no-build
  displayName: Test

- task: Docker@2
  displayName: Build and push order-api image
  inputs:
    command: buildAndPush
    repository: order-api
    dockerfile: services/order/Order.API/Dockerfile
    buildContext: .
    containerRegistry: $(acrServiceConnection)
    tags: |
      $(imageTag)
      latest

- task: KubernetesManifest@1
  displayName: Deploy order-api to AKS
  inputs:
    action: deploy
    kubernetesServiceConnection: saga-aks
    namespace: default
    manifests: |
      infra/k8s/order-api/deployment.yaml
      infra/k8s/order-api/service.yaml
    containers: |
      sagamarketplaceacr.azurecr.io/order-api:$(imageTag)