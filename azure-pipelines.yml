trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  acrServiceConnection: sagamarketplaceacr
  acrLoginServer: sagamarketplaceacr.azurecr.io
  imageTag: $(Build.BuildId)

steps:
- task: UseDotNet@2
  displayName: Use .NET SDK
  inputs:
    packageType: sdk
    version: 9.x

- script: dotnet restore
  displayName: Restore

- script: dotnet build --configuration $(buildConfiguration) --no-restore
  displayName: Build

- script: dotnet test --configuration $(buildConfiguration) --no-build
  displayName: Test

- task: Docker@2
  displayName: Build and push order-api image
  inputs:
    command: buildAndPush
    repository: order-api
    dockerfile: services/order/Order.API/Dockerfile
    buildContext: .
    containerRegistry: $(acrServiceConnection)
    tags: |
      $(imageTag)
      latest

- task: Docker@2
  displayName: Build and push catalog-api image
  inputs:
    command: buildAndPush
    repository: catalog-api
    dockerfile: services/catalog/Catalog.API/Dockerfile
    buildContext: .
    containerRegistry: $(acrServiceConnection)
    tags: |
      $(imageTag)
      latest

- task: Docker@2
  displayName: Build and push inventory-worker image
  inputs:
    command: buildAndPush
    repository: inventory-worker
    dockerfile: services/inventory/Inventory.Worker/Dockerfile
    buildContext: .
    containerRegistry: $(acrServiceConnection)
    tags: |
      $(imageTag)
      latest

- task: Docker@2
  displayName: Build and push payment-worker image
  inputs:
    command: buildAndPush
    repository: payment-worker
    dockerfile: services/payment/Payment.Worker/Dockerfile
    buildContext: .
    containerRegistry: $(acrServiceConnection)
    tags: |
      $(imageTag)
      latest

- task: Docker@2
  displayName: Build and push shipping-worker image
  inputs:
    command: buildAndPush
    repository: shipping-worker
    dockerfile: services/shipping/Shipping.Worker/Dockerfile
    buildContext: .
    containerRegistry: $(acrServiceConnection)
    tags: |
      $(imageTag)
      latest
      
- task: Docker@2
  displayName: Build and push ai-api image
  inputs:
    command: buildAndPush
    repository: ai-api
    dockerfile: services/ai/AI.API/Dockerfile
    buildContext: .
    containerRegistry: $(acrServiceConnection)
    tags: |
      $(imageTag)
      latest

- task: Docker@2
  displayName: Build and push gateway-api image
  inputs:
    command: buildAndPush
    repository: gateway-api
    dockerfile: services/gateway/Gateway.API/Dockerfile
    buildContext: .
    containerRegistry: $(acrServiceConnection)
    tags: |
      $(imageTag)
      latest

- task: Kubernetes@1
  displayName: Apply order-api manifests
  inputs:
    connectionType: Kubernetes Service Connection
    kubernetesServiceEndpoint: saga-aks
    namespace: default
    command: apply
    arguments: -f infra/k8s/order-api/service.yaml

- task: Kubernetes@1
  displayName: Update order-api image
  inputs:
    connectionType: Kubernetes Service Connection
    kubernetesServiceEndpoint: saga-aks
    namespace: default
    command: set
    arguments: image deployment/order-api order-api=sagamarketplaceacr.azurecr.io/order-api:$(imageTag)

- task: Kubernetes@1
  displayName: Apply catalog-api manifests
  inputs:
    connectionType: Kubernetes Service Connection
    kubernetesServiceEndpoint: saga-aks
    namespace: default
    command: apply
    arguments: -f infra/k8s/catalog-api/deployment.yaml -f infra/k8s/catalog-api/service.yaml

- task: Kubernetes@1
  displayName: Update catalog-api image
  inputs:
    connectionType: Kubernetes Service Connection
    kubernetesServiceEndpoint: saga-aks
    namespace: default
    command: set
    arguments: image deployment/catalog-api catalog-api=sagamarketplaceacr.azurecr.io/catalog-api:$(imageTag)

- task: Kubernetes@1
  displayName: Apply inventory-worker manifest
  inputs:
    connectionType: Kubernetes Service Connection
    kubernetesServiceEndpoint: saga-aks
    namespace: default
    command: apply
    arguments: -f infra/k8s/inventory-worker/deployment.yaml

- task: Kubernetes@1
  displayName: Update inventory-worker image
  inputs:
    connectionType: Kubernetes Service Connection
    kubernetesServiceEndpoint: saga-aks
    namespace: default
    command: set
    arguments: image deployment/inventory-worker inventory-worker=sagamarketplaceacr.azurecr.io/inventory-worker:$(imageTag)

- task: Kubernetes@1
  displayName: Apply payment-worker manifest
  inputs:
    connectionType: Kubernetes Service Connection
    kubernetesServiceEndpoint: saga-aks
    namespace: default
    command: apply
    arguments: -f infra/k8s/payment-worker/deployment.yaml

- task: Kubernetes@1
  displayName: Update payment-worker image
  inputs:
    connectionType: Kubernetes Service Connection
    kubernetesServiceEndpoint: saga-aks
    namespace: default
    command: set
    arguments: image deployment/payment-worker payment-worker=sagamarketplaceacr.azurecr.io/payment-worker:$(imageTag)

- task: Kubernetes@1
  displayName: Apply shipping-worker manifest
  inputs:
    connectionType: Kubernetes Service Connection
    kubernetesServiceEndpoint: saga-aks
    namespace: default
    command: apply
    arguments: -f infra/k8s/shipping-worker/deployment.yaml

- task: Kubernetes@1
  displayName: Update shipping-worker image
  inputs:
    connectionType: Kubernetes Service Connection
    kubernetesServiceEndpoint: saga-aks
    namespace: default
    command: set
    arguments: image deployment/shipping-worker shipping-worker=sagamarketplaceacr.azurecr.io/shipping-worker:$(imageTag)

- task: Kubernetes@1
  displayName: Apply ai-api manifest
  inputs:
    connectionType: Kubernetes Service Connection
    kubernetesServiceEndpoint: saga-aks
    namespace: default
    command: apply
    arguments: -f infra/k8s/ai-api/deployment.yaml -f infra/k8s/ai-api/service.yaml

- task: Kubernetes@1
  displayName: Update ai-api image
  inputs:
    connectionType: Kubernetes Service Connection
    kubernetesServiceEndpoint: saga-aks
    namespace: default
    command: set
    arguments: image deployment/ai-api ai-api=sagamarketplaceacr.azurecr.io/ai-api:$(imageTag)

- task: Kubernetes@1
  displayName: Apply gateway-api manifests
  inputs:
    connectionType: Kubernetes Service Connection
    kubernetesServiceEndpoint: saga-aks
    namespace: default
    command: apply
    arguments: -f infra/k8s/gateway/deployment.yaml -f infra/k8s/gateway/service.yaml -f infra/k8s/ingress/gateway-ingress.yaml

- task: Kubernetes@1
  displayName: Update gateway-api image
  inputs:
    connectionType: Kubernetes Service Connection
    kubernetesServiceEndpoint: saga-aks
    namespace: default
    command: set
    arguments: image deployment/gateway-api gateway-api=sagamarketplaceacr.azurecr.io/gateway-api:$(imageTag)
