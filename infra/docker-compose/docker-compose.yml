version: "3.9"

services:

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: marketplace-rabbitmq
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - marketplace-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    container_name: marketplace-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - marketplace-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog-api:
    build:
      context: ../..
      dockerfile: services/catalog/Catalog.API/Dockerfile
    container_name: marketplace-catalog-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CatalogDb: Host=postgres;Port=5432;Database=catalog_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - marketplace-network

  ai-api:
    build:
      context: ../..
      dockerfile: services/ai/AI.API/Dockerfile
    container_name: marketplace-ai-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Gemini__ApiKey: ${GEMINI_API_KEY}
      Gemini__BaseUrl: https://generativelanguage.googleapis.com/v1beta/
      Gemini__Model: gemini-2.5-flash
      Gemini__TimeoutSeconds: 30
    ports:
      - "8082:8080"
    networks:
      - marketplace-network

  order-api:
    build:
      context: ../..
      dockerfile: services/order/Order.API/Dockerfile
    container_name: marketplace-order-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__OrderDb: Host=postgres;Port=5432;Database=order_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - marketplace-network

networks:
  marketplace-network:
    driver: bridge

volumes:
  rabbitmq_data:
  postgres_data:
